blueprint:
  name: Enphase Energy Grid Mode (OTP)
  description: >
    Run an OTP-gated grid mode change for a single Enphase site.
    Select an Enphase config entry and mode when creating the script. Run the
    script once with Request OTP, then run it again with Apply Grid Mode and the
    delivered code.
  domain: script
  author: barneyonline
  source_url: https://github.com/barneyonline/ha-enphase-energy
  input:
    config_entry_id:
      name: Enphase config entry
      description: Enphase site to control.
      selector:
        config_entry:
          integration: enphase_ev
    mode:
      name: Grid mode
      description: Select the target grid mode.
      default: off_grid
      selector:
        select:
          options:
            - on_grid
            - off_grid

fields:
  operation:
    name: Operation
    description: Request an OTP first, then apply Grid Mode with the delivered code.
    required: true
    default: request_otp
    selector:
      select:
        options:
          - label: Request OTP
            value: request_otp
          - label: Apply Grid Mode
            value: set_mode
  otp:
    name: One-time code (OTP)
    description: Enter the delivered 4-digit OTP when applying Grid Mode.
    required: false
    selector:
      text:

mode: single

sequence:
  - variables:
      input_operation: >-
        {{ operation | default('request_otp', true) | string | trim }}
      input_mode: !input mode
      runtime_otp: "{{ otp | default('', true) | string | trim }}"
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ input_operation == 'request_otp' }}"
        sequence:
          - service: enphase_ev.request_grid_toggle_otp
            data:
              config_entry_id: !input config_entry_id
      - conditions:
          - condition: template
            value_template: "{{ input_operation == 'set_mode' }}"
        sequence:
          - service: enphase_ev.set_grid_mode
            data:
              config_entry_id: !input config_entry_id
              mode: "{{ input_mode }}"
              otp: "{{ runtime_otp }}"
