name: CI
permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  push:
    branches:
      - main
    paths:
      - 'custom_components/**'
      - 'tests/components/enphase_ev/**'
      - 'tests/compatibility/**'
      - 'scripts/**/*.py'
      - 'tests/scripts/**/*.py'
      - '.pre-commit-config.yaml'
      - '.ruff.toml'
      - '.strict-typing'
      - 'devtools/docker/requirements-dev.txt'
      - 'devtools/docker/constraints*.txt'
      - 'devtools/docker/requirements-ci-quality.txt'
      - 'devtools/docker/requirements-ci-scripts.txt'
      - 'devtools/docker/requirements-min-ha.txt'
      - 'devtools/docker/requirements-ha-2026.8.txt'
      - 'devtools/docker/Dockerfile'
      - 'devtools/docker/docker-compose.yml'
      - 'pytest.ini'
      - 'quality_scale.yaml'
      - '.github/workflows/tests.yml'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/tests.yml
    secrets: inherit
