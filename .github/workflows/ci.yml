name: CI
permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - '.github/maintenance/**'
      - 'tests/scripts/test_maintenance_*.py'
      - '.github/workflows/maintenance-*.yml'
      - '.github/workflows/release-candidate.yml'
      - '.github/workflows/release-assets.yml'
      - 'custom_components/**'
      - 'tests/components/enphase_ev/**'
      - 'scripts/**/*.py'
      - 'tests/scripts/**/*.py'
      - '.pre-commit-config.yaml'
      - '.ruff.toml'
      - '.strict-typing'
      - 'devtools/docker/requirements-dev.txt'
      - 'devtools/docker/constraints*.txt'
      - 'devtools/docker/requirements-ci-quality.txt'
      - 'devtools/docker/requirements-ci-scripts.txt'
      - 'devtools/docker/Dockerfile'
      - 'devtools/docker/docker-compose.yml'
      - 'hacs.json'
      - 'pytest.ini'
      - '.coveragerc'
      - 'quality_scale.yaml'
      - '.github/workflows/tests.yml'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/tests.yml
