name: Reporter Follow-up

on:
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:
    inputs:
      apply_actions:
        description: Apply reminders and incomplete closures (otherwise report only)
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: maintenance-reporter-followup
  cancel-in-progress: false

jobs:
  reporter-followup:
    runs-on: ubuntu-26.04
    steps:
      - uses: barneyonline/hal-github-maintenance/actions/reporter-followup@ef75c40d8b447fba99cf5d2a158c916ecca317b4
        with:
          token: ${{ github.token }}
          apply_actions: ${{ github.event_name == 'schedule' || inputs.apply_actions }}
