name: Reporter Follow-up

on:
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:
    inputs:
      apply_actions:
        description: Apply reminders and incomplete closures (otherwise report only)
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: maintenance-reporter-followup
  cancel-in-progress: false

jobs:
  reporter-followup:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - name: Follow explicit unanswered reporter requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY_ACTIONS: ${{ github.event_name == 'schedule' || inputs.apply_actions }}
        shell: bash
        run: |
          args=(--repository "$GITHUB_REPOSITORY")
          if [[ "$APPLY_ACTIONS" == true ]]; then
            args+=(--apply)
          fi
          python3 scripts/maintenance/reporter_followup.py "${args[@]}"
