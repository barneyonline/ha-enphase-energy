name: Autonomous Maintenance Review Events

# Public review events may originate from forks with read-only tokens. This
# observer never checks out code; the trusted default-branch gate reconciles it.
on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read

jobs:
  review-event:
    runs-on: ubuntu-26.04
    steps:
      - name: Record review event for trusted reconciliation
        run: echo 'Review event received.'
