name: HAL Control Requests
run-name: HAL control request ${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: hal-control-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-26.04
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'automation/control') &&
      github.event.comment.user.id == 38914183
    steps:
      - uses: barneyonline/hal-github-maintenance/actions/control@134f3edaa7c0c59d1e672e788ebebb8973860b10
        with:
          token: ${{ github.token }}
