name: Autonomous Maintenance Gate
run-name: Maintenance gate / control ${{ inputs.control_request_id || 'event' }}

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  check_run:
    types: [completed]
  check_suite:
    types: [completed]
  status:
  workflow_run:
    workflows: [CI, Tests, Codespell, Validate with hassfest, Quality Scale, Validate, Home Assistant Smoke, Autonomous Maintenance Review Events]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Pull request number (blank reconciles managed open PRs)
        required: false
        type: string

      control_request_id:
        description: Correlation identifier set by the trusted control bridge
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read
  checks: write
  statuses: read

concurrency:
  # One publisher across every event family; keep pending reconciliations queued.
  group: maintenance-gate-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  maintenance-gate:
    runs-on: ubuntu-26.04
    if: >-
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      (github.event_name != 'check_run' || github.event.check_run.name != 'Autonomous maintenance / merge gate')
    steps:
      - uses: barneyonline/hal-github-maintenance/actions/merge-gate@ac687247f4006e65a2580f8c1eaebfefd5403c37
        with:
          token: ${{ github.token }}
          pull_number: ${{ inputs.pull_number }}
