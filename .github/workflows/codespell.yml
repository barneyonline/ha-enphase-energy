name: Codespell

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "custom_components/enphase_ev/**/*.py"
      - "custom_components/enphase_ev/**/*.yaml"
      - "custom_components/enphase_ev/**/*.yml"
      - "custom_components/enphase_ev/strings.json"
      - "custom_components/enphase_ev/translations/en*.json"
      - "scripts/**/*.py"
      - "tests/components/enphase_ev/**/*.py"
      - "tests/scripts/**/*.py"
      - ".codespellignore"
      - ".pre-commit-config.yaml"
      - "*.md"
      - "*.yaml"
      - "*.yml"
      - "**/*.md"
      - "**/*.yaml"
      - "**/*.yml"
      - ".github/workflows/codespell.yml"
  push:
    branches:
      - main
    paths:
      - "custom_components/enphase_ev/**/*.py"
      - "custom_components/enphase_ev/**/*.yaml"
      - "custom_components/enphase_ev/**/*.yml"
      - "custom_components/enphase_ev/strings.json"
      - "custom_components/enphase_ev/translations/en*.json"
      - "scripts/**/*.py"
      - "tests/components/enphase_ev/**/*.py"
      - "tests/scripts/**/*.py"
      - ".codespellignore"
      - ".pre-commit-config.yaml"
      - "*.md"
      - "*.yaml"
      - "*.yml"
      - "**/*.md"
      - "**/*.yaml"
      - "**/*.yml"
      - ".github/workflows/codespell.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: .pre-commit-config.yaml
          cache-suffix: codespell
      - name: Cache pre-commit environment
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-codespell-${{ runner.os }}-py314-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: uv pip install --system "pre-commit==4.6.2"
      - name: Run codespell
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            changed_files="$(git diff --name-only "origin/${{ github.base_ref }}" HEAD)"
            if printf '%s\n' "$changed_files" | grep -Eq '^(\.codespellignore|\.pre-commit-config\.yaml)$'; then
              pre-commit run codespell --all-files
            else
              pre-commit run codespell --from-ref "origin/${{ github.base_ref }}" --to-ref HEAD
            fi
          else
            pre-commit run codespell --all-files
          fi
