name: Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published release tag whose assets should be verified or repaired
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-assets-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-26.04
    outputs:
      source_sha: ${{ steps.refs.outputs.source_sha }}
      tools_sha: ${{ steps.refs.outputs.tools_sha }}
      release_tag: ${{ steps.refs.outputs.release_tag }}
    steps:
      - name: Resolve existing published release and trusted tooling
        id: refs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+-]*$/.test(tag)) throw new Error('Invalid release tag');
            const release = await github.rest.repos.getReleaseByTag({...context.repo, tag});
            if (release.data.draft) throw new Error('This repair path accepts only already-published releases');
            let object = (await github.rest.git.getRef({...context.repo, ref: `tags/${tag}`})).data.object;
            for (let depth = 0; object.type === 'tag' && depth < 5; depth++) {
              object = (await github.rest.git.getTag({...context.repo, tag_sha: object.sha})).data.object;
            }
            if (object.type !== 'commit' || !/^[0-9a-f]{40}$/.test(object.sha)) throw new Error('Release tag does not resolve to one commit');
            const branch = await github.rest.repos.getBranch({...context.repo, branch: context.payload.repository.default_branch});
            core.setOutput('source_sha', object.sha);
            core.setOutput('tools_sha', branch.data.commit.sha);
            core.setOutput('release_tag', tag);

  package:
    cache-mode: none
    needs: resolve
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout trusted default-branch tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.tools_sha }}
          path: tools
          persist-credentials: false
      - name: Checkout exact published source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - name: Build and inspect existing release package
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: >
          python3 tools/scripts/maintenance/package_candidate.py
          --root candidate --domain enphase_ev
          --version "$RELEASE_TAG" --expected-sha "$SOURCE_SHA"
          --historical-release-repair
          --output-dir "$RUNNER_TEMP/release-assets"
      - name: Preserve validated assets and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-${{ needs.resolve.outputs.source_sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/release-assets/*

  attach:
    needs: [resolve, package]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download validated assets without checking out release code
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets-${{ needs.resolve.outputs.source_sha }}
          path: assets
      - name: Preserve matching public assets and verify every uploaded byte
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          COMPONENT_DOMAIN: enphase_ev
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          expected_sha = os.environ["SOURCE_SHA"]
          domain = os.environ["COMPONENT_DOMAIN"]
          filenames = {
              "ha_energy_planner": "ha-energy-planner-{}.zip",
              "enphase_ev": "enphase_ev-{}.zip",
              "groq": "groq-{}.zip",
          }

          def gh(*args):
              return subprocess.run(["gh", *args], check=True, capture_output=True, text=True).stdout

          release = json.loads(gh("api", f"repos/{repository}/releases/tags/{tag}"))
          if release["draft"] or release["tag_name"] != tag:
              raise SystemExit("Public release identity changed")
          obj = json.loads(gh("api", f"repos/{repository}/git/ref/tags/{tag}"))["object"]
          for _ in range(5):
              if obj["type"] != "tag":
                  break
              obj = json.loads(gh("api", f"repos/{repository}/git/tags/{obj['sha']}"))["object"]
          if obj["type"] != "commit" or obj["sha"] != expected_sha:
              raise SystemExit("Published tag changed after package validation")
          evidence = json.loads(Path("assets/package-evidence.json").read_text())
          filename = filenames[domain].format(tag)
          archive = Path("assets") / filename
          if evidence["source_sha"] != expected_sha or evidence["archive"] != filename or evidence["domain"] != domain or evidence["version"] != tag.removeprefix("v"):
              raise SystemExit("Package provenance does not match published source")
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          checksum = archive.with_suffix(".zip.sha256")
          if evidence["sha256"] != digest or checksum.read_text() != f"{digest}  {filename}\n":
              raise SystemExit("Validated package checksum changed")
          for asset in (archive, checksum):
              matches = [item for item in release["assets"] if item["name"] == asset.name]
              if len(matches) > 1:
                  raise SystemExit("Duplicate release asset names require maintainer attention")
              if not matches:
                  gh("release", "upload", tag, str(asset), "--repo", repository)
              with tempfile.TemporaryDirectory() as directory:
                  gh("release", "download", tag, "--pattern", asset.name, "--dir", directory, "--repo", repository)
                  if (Path(directory) / asset.name).read_bytes() != asset.read_bytes():
                      raise SystemExit(f"Existing public asset differs from validated package: {asset.name}; it was preserved")
              print(f"Verified public asset {asset.name}")
          PYTHON
