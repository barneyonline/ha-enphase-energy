name: Quality Scale

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**/*.md"
      - ".github/workflows/quality-scale.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/**/*.md"
      - ".github/workflows/quality-scale.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: devtools/docker/requirements-ci-quality.txt
          cache-suffix: quality-docs
      - name: Install deps
        run: uv pip install --system -r devtools/docker/requirements-ci-quality.txt
      - name: Validate quality scale evidence
        run: python scripts/validate_quality_scale.py
