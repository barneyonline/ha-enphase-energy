name: Quality Scale

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**/*.md"
      - ".github/workflows/quality-scale.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/**/*.md"
      - ".github/workflows/quality-scale.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: devtools/docker/requirements-ci-quality.txt
          cache-suffix: quality-docs
      - name: Install deps
        run: uv pip install --system -r devtools/docker/requirements-ci-quality.txt
      - name: Validate quality scale evidence
        run: python scripts/validate_quality_scale.py
