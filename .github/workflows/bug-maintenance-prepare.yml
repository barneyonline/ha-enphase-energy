name: Disabled maintenance Git-object preparation
run-name: Maintenance source / ${{ inputs.operation }}
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [advance, reconcile, genesis]
        default: advance
        required: true
      selected_fixes:
        type: string
        default: ''
        required: false
      issues:
        type: string
        default: ''
        required: false
      version:
        type: string
        default: ''
        required: false
      notes:
        type: string
        default: ''
        required: false
permissions: {}
concurrency:
  group: bug-publisher-${{ github.repository }}
  cancel-in-progress: false
  queue: max
jobs:
  genesis:
    if: ${{ false }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
          token: ''
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare owner-approved empty preparation catalog only
        id: genesis
        uses: barneyonline/hal-github-maintenance/actions/maintenance-runtime@8fdf6f59d2f95361998fc3f2d89ad338cd141268
        with:
          module: prepare
          phase: genesis
          token: ${{ github.token }}
      - name: Persist preparation checkpoint slot 1 input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.genesis.outputs.artifact_name }}
          path: ${{ runner.temp }}/preparation/maintenance-state.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90
  prepare:
    if: ${{ false }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
          token: ''
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Plan bounded Git-object preparation 1
        id: plan_1
        uses: barneyonline/hal-github-maintenance/actions/maintenance-runtime@8fdf6f59d2f95361998fc3f2d89ad338cd141268
        with:
          module: prepare
          phase: plan
          slot: '1'
          token: ${{ github.token }}
      - name: Persist preparation checkpoint slot 1 input
        id: upload_input_1
        if: ${{ steps.plan_1.outputs.checkpoint == 'true' && steps.plan_1.outputs.effect == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.plan_1.outputs.artifact_name }}
          path: ${{ runner.temp }}/preparation/maintenance-state.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90
      - name: Authenticate preparation checkpoint slot 1 input
        id: confirm_input_1
        if: ${{ steps.upload_input_1.outcome == 'success' }}
        uses: barneyonline/hal-github-maintenance/actions/maintenance-runtime@8fdf6f59d2f95361998fc3f2d89ad338cd141268
        with:
          module: prepare
          phase: confirm
          slot: '1'
          token: ${{ github.token }}
          artifact_id: ${{ steps.upload_input_1.outputs.artifact-id }}
          artifact_digest: ${{ steps.upload_input_1.outputs.artifact-digest }}
      - name: Execute one authenticated Git object 1
        id: effect_1
        if: ${{ steps.confirm_input_1.outputs.effect == 'true' }}
        uses: barneyonline/hal-github-maintenance/actions/maintenance-runtime@8fdf6f59d2f95361998fc3f2d89ad338cd141268
        with:
          module: prepare
          phase: effect
          slot: '1'
          token: ${{ github.token }}
      - name: Persist preparation checkpoint slot 1 result
        id: upload_result_1
        if: ${{ always() && (steps.effect_1.outputs.checkpoint == 'true' || steps.plan_1.outputs.checkpoint == 'true' && steps.plan_1.outputs.effect != 'true') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.effect_1.outputs.artifact_name || steps.plan_1.outputs.artifact_name }}
          path: ${{ runner.temp }}/preparation/maintenance-state.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90
      - name: Authenticate preparation checkpoint slot 1 result
        id: confirm_result_1
        if: ${{ steps.upload_result_1.outcome == 'success' }}
        uses: barneyonline/hal-github-maintenance/actions/maintenance-runtime@8fdf6f59d2f95361998fc3f2d89ad338cd141268
        with:
          module: prepare
          phase: confirm
          slot: '1'
          upload_phase: result
          token: ${{ github.token }}
          artifact_id: ${{ steps.upload_result_1.outputs.artifact-id }}
          artifact_digest: ${{ steps.upload_result_1.outputs.artifact-digest }}
      - name: Refuse rejected preparation 1 after durable result
        if: ${{ steps.confirm_result_1.outputs.refused == 'true' }}
        run: exit 1
      - name: Plan bounded Git-object preparation 2
        id: plan_2
