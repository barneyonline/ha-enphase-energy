      - name: Persist preparation checkpoint slot 2 result
        id: upload_result_2
        if: ${{ always() && (steps.effect_2.outputs.checkpoint == 'true' || steps.plan_2.outputs.checkpoint == 'true' && steps.plan_2.outputs.effect != 'true') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
