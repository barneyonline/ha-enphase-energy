        uses: barneyonline/hal-github-maintenance/actions/maintenance-runtime@8fdf6f59d2f95361998fc3f2d89ad338cd141268
        with:
          module: prepare
          phase: plan
          slot: '2'
          token: ${{ github.token }}
      - name: Persist preparation checkpoint slot 2 input
        id: upload_input_2
        if: ${{ steps.plan_2.outputs.checkpoint == 'true' && steps.plan_2.outputs.effect == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.plan_2.outputs.artifact_name }}
          path: ${{ runner.temp }}/preparation/maintenance-state.json
          if-no-files-found: error
          overwrite: false
