      - name: Execute one authenticated Git object 2
        id: effect_2
        if: ${{ steps.confirm_input_2.outputs.effect == 'true' }}
        uses: barneyonline/hal-github-maintenance/actions/maintenance-runtime@8fdf6f59d2f95361998fc3f2d89ad338cd141268
        with:
          module: prepare
          phase: effect
