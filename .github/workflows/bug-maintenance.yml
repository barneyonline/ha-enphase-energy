name: Disabled maintenance bug-release controller
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [advance, import, reconcile, genesis]
        required: true
      plan_artifact_id:
        type: string
        required: false
  workflow_run:
    workflows: [Disabled maintenance Git-object preparation, Disabled maintenance candidate validation, Disabled maintenance package validation, CI, Tests, Codespell, Validate with hassfest, Quality Scale, Validate, Home Assistant Smoke, Autonomous Maintenance Review Events]
    types: [completed]
  issues:
    types: [edited, reopened]
  issue_comment:
    types: [created, edited]
permissions: {}
concurrency:
  group: bug-publisher-${{ github.repository }}
  cancel-in-progress: false
  queue: max
jobs:
  genesis:
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 40
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
          token: ''
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare owner-approved empty maintenance catalog
        id: genesis
        uses: barneyonline/hal-github-maintenance/actions/maintenance-runtime@847203b85032bdc0ba9a57e132dba1567e786b26
        with:
          module: worker
          phase: genesis
          slot: '1'
          token: ${{ github.token }}
      - name: Persist maintenance checkpoint slot 1 input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.genesis.outputs.artifact_name }}
          path: ${{ runner.temp }}/state/maintenance-state.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90
  effect:
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
      checks: read
      statuses: read
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
          token: ''
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Plan maintenance transition 1
        id: plan_1
        uses: barneyonline/hal-github-maintenance/actions/maintenance-runtime@847203b85032bdc0ba9a57e132dba1567e786b26
        with:
          module: worker
          phase: plan
          slot: '1'
          token: ${{ github.token }}
      - name: Persist maintenance checkpoint slot 1 input
        id: upload_input_1
        if: ${{ always() && steps.plan_1.outputs.checkpoint == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.plan_1.outputs.artifact_name }}
          path: ${{ runner.temp }}/state/maintenance-state.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90
      - name: Authenticate maintenance checkpoint slot 1 input
        id: confirm_input_1
        if: ${{ steps.upload_input_1.outcome == 'success' }}
        uses: barneyonline/hal-github-maintenance/actions/maintenance-runtime@847203b85032bdc0ba9a57e132dba1567e786b26
        with:
          module: worker
          phase: confirm
          slot: '1'
          token: ${{ github.token }}
          artifact_id: ${{ steps.upload_input_1.outputs.artifact-id }}
          artifact_digest: ${{ steps.upload_input_1.outputs.artifact-digest }}
      - name: Execute one confirmed maintenance intent 1
        id: effect_1
        if: ${{ steps.confirm_input_1.outputs.confirmed == 'true' && steps.plan_1.outputs.effect == 'true' }}
        uses: barneyonline/hal-github-maintenance/actions/maintenance-runtime@847203b85032bdc0ba9a57e132dba1567e786b26
        with:
          module: worker
          phase: effect
          slot: '1'
          token: ${{ github.token }}
      - name: Persist maintenance checkpoint slot 1 result
        id: upload_result_1
        if: ${{ always() && steps.effect_1.outputs.checkpoint == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
