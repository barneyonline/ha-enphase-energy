name: Tests

on:
  pull_request:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ format('{0}-{1}', github.workflow_ref || github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      diagnostics: ${{ steps.paths.outputs.diagnostics }}
      integration: ${{ steps.paths.outputs.integration }}
      quality: ${{ steps.paths.outputs.quality }}
      scripts: ${{ steps.paths.outputs.scripts }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed paths
        id: paths
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            for group in diagnostics integration quality scripts; do
              echo "${group}=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi

          # Preserve history for the merge-base diff if the base branch advances
          # after checkout (including when an older workflow run is retried).
          git fetch origin "${{ github.base_ref }}"
          # Disable rename detection so cross-group moves expose both the deleted
          # source path and the added destination path to the classifiers below.
          changed_files="$(git diff --name-only --no-renames "origin/${{ github.base_ref }}...HEAD")"

          set_output() {
            local name="$1"
            local pattern="$2"
            local paths="${3-$changed_files}"
            local value="false"
            if printf '%s\n' "$paths" | grep -Eq "$pattern"; then
              value="true"
            fi
            echo "${name}=${value}" >> "$GITHUB_OUTPUT"
          }

          # Descriptive metadata and version bumps retain hassfest, HACS, lint,
          # and quality checks. Dependency or discovery edits cannot skip pytest.
          integration_files="$changed_files"
          manifest='custom_components/enphase_ev/manifest.json'
          if printf '%s\n' "$changed_files" | grep -Fxq "$manifest"; then
            if python3 scripts/ci_manifest_metadata.py --base-ref "origin/${{ github.base_ref }}"; then
              integration_files="$(printf '%s\n' "$changed_files" | grep -Fxv "$manifest" || true)"
              echo "Manifest metadata or version change; checking other paths for runtime tests."
            fi
          fi

          # Validate classifier and test-workflow edits with the script suite.
          test_infrastructure='^(\.github/workflows/tests\.yml|scripts/ci_manifest_metadata\.py|tests/scripts/test_ci_workflow\.py)$'
          common='^(hacs\.json|devtools/docker/(Dockerfile|docker-compose\.yml|constraints-[^/]+\.txt))$'
          set_output integration "${common}|^scripts/(benchmark_snapshots|check_statement_coverage)\.py$|^custom_components/enphase_ev/|^tests/components/enphase_ev/|^devtools/docker/requirements-dev\.txt$|^pytest\.ini$|^\.coveragerc$|^\.pre-commit-config\.yaml$|^\.ruff\.toml$" "$integration_files"
          set_output diagnostics "${common}|^custom_components/enphase_ev/.*\.py$|^scripts/importtime_profile\.py$|^tests/scripts/test_importtime_profile\.py$|^devtools/docker/requirements-dev\.txt$"
          set_output quality "${common}|${test_infrastructure}|^custom_components/enphase_ev/|^tests/components/enphase_ev/|^quality_scale\.yaml$|^scripts/validate_quality_scale\.py$|^tests/scripts/test_validate_quality_scale\.py$|^devtools/docker/requirements-(dev|ci-quality)\.txt$|^\.pre-commit-config\.yaml$|^\.strict-typing$"
          set_output scripts "${common}|${test_infrastructure}|^scripts/.*\.py$|^tests/scripts/.*\.py$|^devtools/docker/requirements-ci-scripts\.txt$|^custom_components/enphase_ev/|^tests/components/enphase_ev/" "$integration_files"

  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: .pre-commit-config.yaml
      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-lint-${{ runner.os }}-py314-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: uv pip install --system "pre-commit==4.6.2"
      - name: Run pre-commit
        env:
          SKIP: codespell,mypy-enphase-ev
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            changed_files="$(git diff --name-only "origin/${{ github.base_ref }}" HEAD)"
            if printf '%s\n' "$changed_files" | grep -Eq '^(\.pre-commit-config\.yaml|\.ruff\.toml)$'; then
              pre-commit run --all-files
            else
              pre-commit run --from-ref "origin/${{ github.base_ref }}" --to-ref HEAD
            fi
          else
            pre-commit run --all-files
          fi

  quality-scale:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.quality == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: devtools/docker/requirements-ci-quality.txt
          cache-suffix: quality
      - name: Install deps
        run: uv pip install --system -r devtools/docker/requirements-ci-quality.txt
      - name: Validate quality scale evidence and Home Assistant brands assets
        run: python scripts/validate_quality_scale.py --validate-remote-brands
      - name: Validate strict typing for full integration package
        run: mypy --strict --ignore-missing-imports --follow-imports=skip custom_components/enphase_ev

  python314-diagnostics:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.diagnostics == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            devtools/docker/requirements-dev.txt
            devtools/docker/constraints-dev.txt
      - name: Install deps
        run: |
          uv pip install --system -r devtools/docker/requirements-dev.txt
          python -c "from homeassistant.const import __version__; assert __version__ == '2026.10.0', __version__; print(f'Home Assistant {__version__}')"
      - name: Gate integration import deprecations and profile import time
        run: python scripts/importtime_profile.py --strict-integration-warnings --output importtime-enphase-ev.log
      - name: Upload import-time profile
        uses: actions/upload-artifact@v7
        with:
          name: importtime-enphase-ev-python314
          path: importtime-enphase-ev.log

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.integration == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            devtools/docker/requirements-dev.txt
            devtools/docker/constraints-dev.txt
      - name: Install deps
        run: |
          uv pip install --system -r devtools/docker/requirements-dev.txt
          python -c "from homeassistant.const import __version__; assert __version__ == '2026.10.0', __version__; print(f'Home Assistant {__version__}')"
      - name: Detect changed integration modules
        id: changed
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          mapfile -t changed < <(
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- "custom_components/enphase_ev/*.py" |
            while IFS= read -r path; do
              [ -f "$path" ] && printf '%s\n' "$path"
            done
          )
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No changed integration Python modules; skipping targeted coverage."
            echo "include=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'Changed integration modules:\n'
          printf '  %s\n' "${changed[@]}"
          include=$(IFS=,; echo "${changed[*]}")
          echo "include=${include}" >> "$GITHUB_OUTPUT"
      - name: Run tests
        id: pytest
        continue-on-error: true
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTEST_PLUGINS: pytest_asyncio.plugin,pytest_homeassistant_custom_component.plugins,pytest_cov.plugin,pytest_github_actions_annotate_failures.plugin
        run: pytest -q tests/components/enphase_ev --cov=custom_components.enphase_ev --cov-branch --cov-report=term-missing --cov-report=xml --cov-report=json --cov-fail-under=100 --junitxml=junit.xml -o junit_family=legacy --log-file=pytest-runtime-warnings.log --log-file-level=WARNING
      - name: Upload runtime warning log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pytest-runtime-warnings-python314
          path: pytest-runtime-warnings.log
          if-no-files-found: ignore
      - name: Enforce 100% coverage on changed integration modules
        id: targeted_coverage
        if: ${{ steps.changed.outputs.include != '' }}
        continue-on-error: true
        run: python scripts/check_statement_coverage.py --report coverage.json --include="${{ steps.changed.outputs.include }}"
      - name: Check report file budgets
        id: report_budget
        if: ${{ always() && (steps.pytest.outcome == 'success' || steps.pytest.outcome == 'failure') }}
        shell: bash
        run: |
          python3 - <<'PY'
          import stat
          from pathlib import Path
          reports = [Path('coverage.xml'), Path('junit.xml')]
          optional = Path('coverage.json')
          if optional.exists() or optional.is_symlink():
              reports.append(optional)
          total = 0
          for path in reports:
              info = path.lstat()
              if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1:
                  raise SystemExit('Report must be a regular file with one link')
              if not 0 < info.st_size <= 16777216:
                  raise SystemExit('Report file budget exceeded')
              total += info.st_size
          if total > 33554432:
              raise SystemExit('Report aggregate budget exceeded')
          PY
      - name: Preserve attempt-specific test and coverage evidence
        if: ${{ always() && steps.report_budget.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-evidence-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            coverage.xml
            junit.xml
            coverage.json
      - name: Fail if tests or targeted coverage failed
        if: ${{ steps.pytest.outcome == 'failure' || steps.targeted_coverage.outcome == 'failure' }}
        run: exit 1

  script-tests:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.scripts == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: devtools/docker/requirements-ci-scripts.txt
          cache-suffix: script-tests
      - name: Install deps
        run: uv pip install --system -r devtools/docker/requirements-ci-scripts.txt
      - name: Run maintenance script tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTEST_PLUGINS: pytest_asyncio.plugin
        run: pytest -q tests/scripts --log-file=script-runtime-warnings.log --log-file-level=WARNING
      - name: Upload maintenance script warning log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: script-runtime-warnings
          path: script-runtime-warnings.log
          if-no-files-found: ignore

  repository-checks:
    name: Repository checks
    if: ${{ always() }}
    needs: [changes, pre-commit, quality-scale, python314-diagnostics, pytest, script-tests]
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Require every applicable check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] not in {'success', 'skipped'}]
          if failed:
              raise SystemExit('Required checks did not pass: ' + ', '.join(failed))
          print('All applicable repository checks passed.')
          PYTHON
