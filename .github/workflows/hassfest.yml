name: Validate with hassfest

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "custom_components/**"
      - "quality_scale.yaml"
      - ".github/workflows/hassfest.yml"
  push:
    branches:
      - main
    paths:
      - "custom_components/**"
      - "quality_scale.yaml"
      - ".github/workflows/hassfest.yml"
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Track current metadata rules independently of the supported HA runtime.
      HASSFEST_IMAGE: ghcr.io/home-assistant/hassfest:latest
    steps:
      - uses: actions/checkout@v7
      - name: Pull latest hassfest image
        run: docker pull "$HASSFEST_IMAGE"
      - name: Log hassfest Home Assistant version
        run: >-
          docker run --rm --workdir /usr/src/homeassistant --entrypoint python3
          "$HASSFEST_IMAGE" -c
          "from homeassistant.const import __version__; print(f'Home Assistant {__version__}')"
      - name: Validate with hassfest
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/github/workspace"
          "$HASSFEST_IMAGE"
