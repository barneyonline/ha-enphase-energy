name: Validate with hassfest

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "custom_components/**"
      - "quality_scale.yaml"
      - ".github/workflows/hassfest.yml"
  push:
    branches:
      - main
    paths:
      - "custom_components/**"
      - "quality_scale.yaml"
      - ".github/workflows/hassfest.yml"
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Validate with the verified Home Assistant 2026.10.2 image.
      HASSFEST_IMAGE: ghcr.io/home-assistant/hassfest@sha256:2dce3c5423a600e7965e5a3d5a95e0707e8452fb001ab2b5d0602099bbecba92
    steps:
      - uses: actions/checkout@v7
      - name: Verify hassfest Home Assistant version
        run: >-
          docker run --rm --workdir /usr/src/homeassistant --entrypoint python3
          "$HASSFEST_IMAGE" -c
          "from homeassistant.const import __version__; assert __version__ == '2026.10.2', __version__; print(f'Home Assistant {__version__}')"
      - name: Validate with hassfest
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/github/workspace"
          "$HASSFEST_IMAGE"
