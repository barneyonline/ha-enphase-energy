name: Disabled maintenance candidate validation
run-name: Maintenance candidate-validation / ${{ inputs.candidate_sha }} / ${{ inputs.plan_sha256 }} / ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      plan:
        type: string
        required: true
      candidate_sha:
        type: string
        required: true
      plan_sha256:
        type: string
        required: true
      request_id:
        type: string
        required: true
permissions: {}
concurrency:
  group: maintenance-candidate-validation-${{ github.repository }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false
  queue: max
jobs:
  stage:
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
          token: ''
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Stage immutable exact candidate without executing it
        uses: barneyonline/hal-github-maintenance/actions/maintenance-runtime@847203b85032bdc0ba9a57e132dba1567e786b26
        with:
          module: validation
          phase: stage
          validation_phase: candidate-validation
          token: ${{ github.token }}
      - name: Upload exact candidate staging data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: maintenance-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-stage
          if-no-files-found: error
          overwrite: false
          retention-days: 7
  validate:
    if: ${{ false }}
    needs: stage
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 150
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
          token: ''
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Download exact staged candidate data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: maintenance-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-stage
      - name: Run fixed full contract inside networkless credential-free Docker
        uses: barneyonline/hal-github-maintenance/actions/maintenance-runtime@847203b85032bdc0ba9a57e132dba1567e786b26
        with:
          module: validation
          phase: run
          validation_phase: candidate-validation
      - name: Upload immutable maintenance validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: maintenance-candidate-validation-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.candidate_sha }}
          path: |
            ${{ runner.temp }}/validation-result/validation.json
            ${{ runner.temp }}/validation-result/untrusted-validation.log
          if-no-files-found: error
          overwrite: false
          retention-days: 90
