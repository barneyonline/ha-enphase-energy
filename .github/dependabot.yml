version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /devtools/docker
    schedule:
      interval: weekly
    # Keep routine Python version PRs disabled; other security updates remain enabled.
    open-pull-requests-limit: 0
    # Home Assistant-owned transitive pins are not duplicated in this repository.
    # Direct dependencies and independently upgradable tooling stay visible.
